<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin | OxyLux Solutions</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f3eee6">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin.css">
</head>
<body class="admin">

<!-- Sign in -->
<main class="a-login" id="login-view" hidden>
  <form class="a-login-card" id="login-form" novalidate>
    <img src="/assets/logo-clear.webp" alt="OxyLux Solutions" width="150" height="154">
    <h1>Admin sign in</h1>
    <label>Email<input name="email" type="email" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="a-error" id="login-error" role="alert" hidden></p>
    <button class="btn" type="submit">Sign in</button>
  </form>
</main>

<!-- Dashboard -->
<div class="a-app" id="app-view" hidden>
  <header class="a-top">
    <div class="a-top-inner">
      <a class="brand" href="/"><img src="/assets/emblem.webp" alt="" width="44" height="34">OxyLux <span class="a-tag">Admin</span></a>
      <div class="a-top-actions">
        <span class="a-user" id="user"></span>
        <button class="c-link" type="button" id="logout">Sign out</button>
      </div>
    </div>
  </header>

  <main class="a-main">
    <p class="a-banner" id="storage-banner" hidden></p>

    <div class="a-head">
      <div>
        <h1>Appointments</h1>
        <p class="a-sub" id="summary"></p>
      </div>
      <div class="a-head-actions">
        <input type="search" id="search" placeholder="Search name, phone or email" aria-label="Search appointments">
        <button class="btn btn-ghost" type="button" id="refresh">Refresh</button>
      </div>
    </div>

    <div class="a-stats" id="stats"></div>

    <div class="a-tabs" role="tablist">
      <button role="tab" data-tab="upcoming" aria-selected="true">Upcoming</button>
      <button role="tab" data-tab="past" aria-selected="false">Past</button>
      <button role="tab" data-tab="cancelled" aria-selected="false">Cancelled</button>
      <button role="tab" data-tab="consent" aria-selected="false">Consent forms only</button>
    </div>

    <div class="a-list" id="list" aria-live="polite"></div>
  </main>
</div>

<!-- Detail drawer -->
<div class="a-scrim" id="scrim" hidden></div>
<aside class="a-drawer" id="drawer" hidden aria-labelledby="d-name" role="dialog" aria-modal="true">
  <div class="a-drawer-head">
    <div>
      <p class="a-sub" id="d-when"></p>
      <h2 id="d-name"></h2>
      <span class="a-status" id="d-status"></span>
    </div>
    <button class="a-close" type="button" id="d-close" aria-label="Close">×</button>
  </div>
  <div class="a-drawer-body" id="d-body"></div>
  <div class="a-drawer-foot" id="d-actions"></div>
</aside>

<script src="/admin.js" defer></script>
</body>
</html>
